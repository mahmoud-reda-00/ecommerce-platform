apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: orders
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mahmoud-reda-00/ecommerce-platform.git
    targetRevision: main
    path: helm/service
    helm:
      valueFiles:
        - ../values/orders.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
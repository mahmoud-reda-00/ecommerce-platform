version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres   # الـ superuser password بتاع الـ container نفسه
    volumes:
      - ecommerce-pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  products-service:
    build: ./services/products-service
    container_name: products-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: products_db
      DB_USER: products_user
      DB_PASSWORD: products_pass
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  users-service:
    build: ./services/users-service
    container_name: users-service
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: users_db
      DB_USER: users_user
      DB_PASSWORD: users_pass
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy

  orders-service:
    build: ./services/orders-service
    container_name: orders-service
    ports:
      - "3002:3000"
    environment:
      DB_HOST: postgres
      DB_NAME: orders_db
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      PRODUCTS_SERVICE_URL: http://products-service:3000
      USERS_SERVICE_URL: http://users-service:3000
    depends_on:
      - postgres
      - products-service
      - users-service

volumes:
  ecommerce-pgdata:
     name: ecommerce-pgdata
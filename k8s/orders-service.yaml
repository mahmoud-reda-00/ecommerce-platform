apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-service
  template:
    metadata:
      labels:
        app: orders-service
    spec:
      containers:
        - name: orders-service
          image: mv7moud/ecommerce-orders-service:52907d4f9dd61cb5ddec29f5f58db89fcb9f3a54
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_NAME
              value: orders_db
            - name: DB_USER
              value: orders_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: ORDERS_DB_PASSWORD
            - name: PRODUCTS_SERVICE_URL
              value: http://products-service:3000
            - name: USERS_SERVICE_URL
              value: http://users-service:3000
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: ecommerce
spec:
  selector:
    app: orders-service
  ports:
    - port: 3000
      targetPort: 3000

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: ecommerce
data:
  init.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<EOSQL
      CREATE USER products_user WITH PASSWORD '${PRODUCTS_DB_PASSWORD}';
      CREATE USER orders_user WITH PASSWORD '${ORDERS_DB_PASSWORD}';
      CREATE USER users_user WITH PASSWORD '${USERS_DB_PASSWORD}';

      CREATE DATABASE products_db OWNER products_user;
      CREATE DATABASE orders_db OWNER orders_user;
      CREATE DATABASE users_db OWNER users_user;

      REVOKE CONNECT ON DATABASE products_db FROM PUBLIC;
      REVOKE CONNECT ON DATABASE orders_db FROM PUBLIC;
      REVOKE CONNECT ON DATABASE users_db FROM PUBLIC;
    EOSQL

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: ecommerce
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: POSTGRES_PASSWORD
            - name: PRODUCTS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: PRODUCTS_DB_PASSWORD
            - name: ORDERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: ORDERS_DB_PASSWORD
            - name: USERS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: USERS_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/init.sh
              subPath: init.sh
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ecommerce
spec:
  selector:
    app: postgres
  ports:
    - port: 5432

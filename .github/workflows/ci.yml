name: Ecommerce Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.1.0

      - name: Build and start the stack
        run: docker compose up -d --build

      - name: containers list
        run: docker compose ps

      - name: Wait for services
        run: |
          for port in 3000 3001 3002; do
            for i in $(seq 1 30); do
              if curl -fs "http://localhost:${port}/ready" > /dev/null; then
                echo "port ${port} is ready"
                break
              fi

              if [ "$i" -eq 30 ]; then
                echo "port ${port} never became ready"
                exit 1
              fi

              sleep 2
            done
          done

      - name: Run integration tests
        run: bash test-all.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4.5.1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push images
        if: github.event_name == 'push'
        run: |
          for svc in products-service users-service orders-service; do
            docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-$svc:${{ github.sha }} ./services/$svc
            docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-$svc:${{ github.sha }}
          done

      - name: Update image tags in Helm values
        if: github.event_name == 'push'
        run: |
          for name in products users orders; do
            sed -i "s|^  tag: .*|  tag: \"${{ github.sha }}\"|" helm/values/$name.yaml
          done

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add helm/values

          if git diff --cached --quiet; then
            echo "no tag changes"
            exit 0
          fi

          git commit -m "ci: update image tags to ${{ github.sha }}"

          git pull --rebase origin main

          git push origin main
